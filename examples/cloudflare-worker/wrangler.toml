name = "cascade-headless"
main = "src/index.js"
compatibility_date = "2025-08-01"

# --------------------------------------------------------------------------
# Module rules. Cloudflare Workers cannot compile WebAssembly at runtime
# (`WebAssembly.compile`/`new WebAssembly.Module` throw), so every .wasm is
# imported as an ALREADY-COMPILED `WebAssembly.Module` binding, which
# cascade-core's asset seam (WasmAssets.js) takes directly. TTFs come in as
# ArrayBuffers.
# --------------------------------------------------------------------------
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

# --------------------------------------------------------------------------
# `nodejs_compat` is deliberately NOT enabled. It would define `process`,
# and OpenCascade's Emscripten glue sniffs `globalThis.process?.versions
# ?.node` to decide it is running under Node — at which point it reaches for
# createRequire/fs and dies. Without it the glue takes the plain-web branch,
# which is exactly right, and `import("module")` (the node-only line it never
# reaches) is stubbed out by the alias below so the bundler can resolve it.
# --------------------------------------------------------------------------
#
# Both Emscripten glues (OpenCascade's and MicroPython's) carry a node-only
# branch that dynamically imports fs/path/url/module. It is unreachable here,
# but the bundler still has to resolve the specifiers.
[alias]
module = "./src/node-module-stub.js"
fs = "./src/node-module-stub.js"
path = "./src/node-module-stub.js"
url = "./src/node-module-stub.js"

# Free plan: 10 ms CPU. Meshing/booleans on a real part need more, so the
# starter model wants a paid plan. Uncomment on paid:
# [limits]
# cpu_ms = 300

[observability]
enabled = true
