name = "cascade-headless"
main = "src/index.js"
compatibility_date = "2025-08-01"
# Wrangler re-bundles src/ with esbuild, and its default keep_names wraps every
# named function in a __name() defineProperty. The embind glue mints its
# invoker closures PER BOUND METHOD at engine boot (~216k), so that one
# default costs ~30 MB of V8 heap in the isolate (measured through the
# inspector: see FIDELITY-ON-WORKERS.md) for names nothing reads.
keep_names = false

# --------------------------------------------------------------------------
# Two deployments of the same code, one per build123d SOURCE FLAVOR. The
# engine keeps all of its state on the worker global and a Python runtime
# boots ONE library, so one isolate serves exactly one flavor — this is a
# wrangler environment (with its own entry module), not a query parameter.
#
#   (default)      src/index.js           build123d-lite        cascade-headless
#   --env upstream src/index-upstream.js  upstream 0.13.0       cascade-headless-upstream
#   --env warm     src/index.js, BOOT=warm (see below)          cascade-headless-warm
#   --env real     src/real.js            REAL build123d 0.13.0 cascade-headless-real
#                                         wheel + numpy on Pyodide
#
# EVERY asset is a module of the Worker script — wasm, the MicroPython glue,
# the four FreeSans faces and (upstream only) the Python layer. Cloudflare
# has had no compressed-size limit since 2026-09-04: a Worker may be 64 MiB
# UNCOMPRESSED on Free and Paid alike (`Total Upload` in `wrangler deploy
# --dry-run`), and this is ~25 MiB (lite) / ~28 MiB (upstream) / ~48 MiB
# (real) with the native-EH OCCT build (+~7 MiB each on the JS-EH pin). The fonts and
# the upstream Python used to be Workers Static Assets fetched through
# `env.ASSETS` to squeeze under the old 10 MiB-gzip cap; that cost a
# subrequest round trip on every cold isolate (0.2-1.15 s on the edge) and
# forced the boot into a fetch handler. See SIZE-INVESTIGATION.md.
# --------------------------------------------------------------------------

# When the engine boots — request (default) | startup | warm. See BOOT_MODES
# in src/app.js. `warm` runs the whole boot plus a Box -> STEP warm-up at
# global scope (~0.3 s of CPU locally for lite, against Cloudflare's 1 s
# startup limit), after which a trivial request costs single-digit ms of CPU.
[vars]
BOOT = "request"

# --------------------------------------------------------------------------
# Module rules. Cloudflare Workers cannot compile WebAssembly at runtime
# (`WebAssembly.compile`/`new WebAssembly.Module` throw), so every .wasm is
# imported as an ALREADY-COMPILED `WebAssembly.Module` binding, which
# cascade-core's asset seam (WasmAssets.js) takes directly. TTFs come in as
# ArrayBuffers.
# --------------------------------------------------------------------------
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.zip", "**/*.whl", "**/upstream-b123d.json"]
fallthrough = false

# The upstream build123d Python layer (upstream-b123d.json, in the Data rule
# above): ONE relative-path -> source map, as a Data module (an ArrayBuffer)
# rather than esbuild's JSON loader, which would turn 3 MB of source into a
# JS object literal parsed with the script, or a Text module, whose string
# could never be released: src/app.js decodes it
# once at engine boot and detaches the buffer (ArrayBuffer.transfer), so the
# backing store is collected (measured: 28.6 -> 0 MB of backing storage for a
# 30 MB test module).

# --------------------------------------------------------------------------
# `nodejs_compat` is deliberately NOT enabled. It defines `process`, and an
# Emscripten glue built for all environments sniffs
# `globalThis.process?.versions?.node` to decide it is running under Node — at
# which point it reaches for createRequire/fs and dies. OpenCascade's glue is
# no longer exposed to that (the fork builds it with `-sENVIRONMENT=web`:
# there IS no node branch in it any more), but MicroPython's vendored glue
# still has one, so the flag stays off.
# --------------------------------------------------------------------------
#
# MicroPython's glue carries a node-only branch that dynamically imports
# fs/path/url/module. It is unreachable here, but the bundler still has to
# resolve the specifiers — verified by deleting this block, which fails the
# build with four "Could not resolve" errors.
[alias]
module = "./src/node-module-stub.js"
fs = "./src/node-module-stub.js"
path = "./src/node-module-stub.js"
url = "./src/node-module-stub.js"

# CPU time. The free plan caps a request at 10 ms, which is not enough for
# any real boolean; the paid plan defaults to 30 s and allows up to 5 min.
# 30 s is a real ceiling for this workload — examples/heat_exchanger spent
# ~37 s and came back HTTP 503 — so ask for the maximum. A request that
# still exceeds it is killed and 503s; nothing here can extend it further.
[limits]
cpu_ms = 300000

[observability]
enabled = true

# --------------------------------------------------------------------------
# The verbatim-upstream flavor: its own entry module (it adds the upstream
# Python layer as a Text module; the lite isolate never holds it). `vars` are
# not inheritable, so BOOT is repeated. BOOT=warm is refused by the entry —
# the upstream library boot alone (~1.1 s of CPU) is over the 1 s startup
# limit.
# --------------------------------------------------------------------------
[env.upstream]
name = "cascade-headless-upstream"
main = "src/index-upstream.js"

[env.upstream.vars]
BOOT = "request"

[env.upstream.limits]
cpu_ms = 300000

[env.upstream.observability]
enabled = true

# --------------------------------------------------------------------------
# The REAL flavor: the actual build123d 0.13.0 wheel + real numpy on Pyodide
# 314, over the same OCP shim and OCCT kernel. Its own entry (src/real.js)
# so the ~20 MB of Pyodide module bindings ride only in this script. Needs
# `node scripts/prepare-pyodide.mjs` (which needs vendor/pyodide:
# packages/cascade-core/scripts/fetch-pyodide.cjs). BOOT=warm is downgraded
# to startup by the entry (Pyodide + numpy + build123d import is ~1.8 s).
# See FIDELITY-ON-WORKERS.md. Not deployed; verified under `wrangler dev`.
# --------------------------------------------------------------------------
[env.real]
name = "cascade-headless-real"
main = "src/real.js"

[env.real.vars]
BOOT = "request"

[env.real.limits]
cpu_ms = 300000

[env.real.observability]
enabled = true

# --------------------------------------------------------------------------
# build123d-lite with the engine booted AND warmed at global scope. This is
# the configuration the Free plan's 10 ms of CPU per request would need (and
# it is still only enough for trivial models — see SIZE-INVESTIGATION.md).
# Not deployed; `npx wrangler dev --env warm` exercises it locally, and a
# `wrangler deploy --env warm` would report its real "Worker Startup Time".
# --------------------------------------------------------------------------
[env.warm]
name = "cascade-headless-warm"

[env.warm.vars]
BOOT = "warm"

[env.warm.limits]
cpu_ms = 300000

[env.warm.observability]
enabled = true
